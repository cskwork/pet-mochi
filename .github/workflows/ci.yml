name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref so a quick second push doesn't
# burn extra runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (vitest + svelte-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm test

  backend:
    name: Backend (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target
      - name: cargo test --lib
        working-directory: src-tauri
        run: cargo test --lib --quiet
      - name: cargo build (debug)
        working-directory: src-tauri
        run: cargo build --quiet

  # Compiles and tests the Windows-only code paths (autostart validation,
  # reparse-point sandbox guards) that the Linux job never builds.
  backend-windows:
    name: Backend (Windows cargo test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target
      - name: cargo test --lib
        working-directory: src-tauri
        run: cargo test --lib --quiet
      - name: cargo build (debug)
        working-directory: src-tauri
        run: cargo build --quiet
